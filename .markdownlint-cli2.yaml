# The shared configuration, which the apps use too, without the app-only ignores.
globs:
  - "**/*.md"
gitignore: true
ignores:
  - node_modules/**
config:
  default: true
  MD013:
    line_length: 120
    code_blocks: false
    tables: false
  MD024:
    siblings_only: true
  MD033: false
  MD041: false
