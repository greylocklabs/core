name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  commitlint:
    uses: greylocklabs/.github/.github/workflows/commitlint.yml@v1

  markdownlint:
    uses: greylocklabs/.github/.github/workflows/markdownlint.yml@v1

  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Check the scripts
        run: shellcheck tooling/*.sh tooling/commit-msg scripts/*.sh tests/*.sh
      - name: Release a made-up app
        run: tests/release_test.sh
      - name: Build a made-up app's tarball
        run: tests/tarball_test.sh
      - name: Include common.mk in a made-up app
        run: tests/make_test.sh

  cpp:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fedora
            image: fedora:44
          - name: debian
            image: debian:trixie
    name: cpp (${{ matrix.name }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      # git has to exist before checkout, or the action cannot clone.
      - name: Install build dependencies (Fedora)
        if: matrix.name == 'fedora'
        run: >-
          dnf install -y --setopt=install_weak_deps=False
          git gcc-c++ cmake ninja-build clang-tools-extra qt6-qtbase-devel qt6-qtdeclarative-devel
          tomlplusplus-devel

      - name: Install build dependencies (Debian)
        if: matrix.name == 'debian'
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates build-essential cmake ninja-build clang-format qt6-base-dev \
            qt6-declarative-dev-tools libtomlplusplus-dev

      - uses: actions/checkout@v7

      - name: Check C++ formatting
        if: matrix.name == 'fedora'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          tooling/format.sh check

      - name: Build with warnings as errors, and test
        run: |
          cmake -S . -B build -G Ninja -DGREYLOCK_WERROR=ON
          cmake --build build
          ctest --test-dir build --output-on-failure

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The default also asks for "tools", which current command-line tools no longer ship.
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Kotlin formatting
        run: ./gradlew spotlessCheck

      - name: Build, test and lint the Compose library
        run: ./gradlew :ui:testDebugUnitTest :ui:lintRelease :ui:assembleRelease
